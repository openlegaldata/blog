# Curated grouping of the papers in _data/papers.yml (generated from
# oldp-citations by scripts/build_papers.py). Every citekey must appear in
# exactly one topic or under `hidden`; `uv run scripts/build_papers.py --check`
# enforces that.
#
# The first topic (`llm`) is rendered as highlight cards on the research page
# and the homepage. Its `model` and `note` fields are checked against each
# paper's full text: only list work where Open Legal Data is part of the
# training data or corpus, not work that only cites the platform.

topics:
  - id: llm
    title: Language models trained on Open Legal Data
    intro: >-
      German court decisions and laws from Open Legal Data are part of the
      training data of several open language models and pretraining corpora.
    papers:
      - key: chan2020german
        model: GBERT & GELECTRA
        note: German BERT and ELECTRA models; 2.4 GB of Open Legal Data court decisions in the pretraining corpus.
      - key: ostendorff2023efficient
        model: BLOOM-CLP German
        note: German GPT-style models; web text complemented with court decisions from Open Legal Data.
      - key: dada2023impact
        model: GeBERTa
        note: German DeBERTa models; pretraining data includes Open Legal Data cases and laws.
      - key: brandizzi2024data
        model: OpenGPT-X (Teuken)
        note: Open Legal Data is one of the curated sources in the OpenGPT-X pretraining data.
      - key: gonzalez2025salamandra
        model: Salamandra
        note: Multilingual LLMs (2B to 40B); training corpus includes Open Legal Data court decisions and laws.
      - key: tamayo2026mrbert
        model: MrBERT
        note: Multilingual encoders; training data includes Open Legal Data court decisions and laws.
      - key: ostendorff2024llm
        model: LLM-datasets
        note: Open framework for building LLM pretraining corpora; ships Open Legal Data as a German legal source.
      - key: gienapp2025german
        model: German Commons
        note: 154 billion tokens of openly licensed German text; Open Legal Data is part of its legal subset.

