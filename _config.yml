markdown: kramdown

title: Open Legal Data
author: Open Legal Data
email: hello@openlegaldata.io
icon: fa-balance-scale
description: >-
  Free access to legal information: open German court decisions and laws as
  open data, REST API and MCP server for AI assistants.

github_username: openlegaldata

# Links used across the site (homepage boxes, footer, data page).
links:
  platform: https://de.openlegaldata.io/
  api_docs: https://de.openlegaldata.io/pages/api/
  api_swagger: https://de.openlegaldata.io/api/docs/
  mcp_server: https://de.openlegaldata.io/mcp
  mcp_docs: https://openlegaldata.github.io/oldp/mcp.html
  signup: https://de.openlegaldata.io/accounts/signup/
  huggingface: https://huggingface.co/openlegaldata
  github: https://github.com/openlegaldata
  discord: https://discord.gg/WCy3aq25ZF
  citations: https://github.com/openlegaldata/oldp-citations
  paper_doi: https://doi.org/10.1145/3383583.3398616
  paper_arxiv: https://arxiv.org/abs/2005.13342

# Self-hosted, cookieless Matomo (same setup as de.openlegaldata.io, see
# _includes/matomo.html). Tracking is off while matomo_site_id is empty and
# in non-production builds.
matomo_url: https://matomo.openlegaldata.io/
matomo_site_id: ""

plugins:
  - jekyll-feed
  - jekyll-redirect-from

sass:
  style: compressed
  sass_dir: _sass

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts
  - start.sh
  - sbin
  - vendor
